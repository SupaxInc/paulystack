<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 159 950 398" width="950" height="398" role="img" aria-labelledby="t d">
<title id="t">paulystack</title>
<desc id="d">A round brilliant diamond made of its 57 polygon facets. Each band of facets is one paulystack skill: the pavilion is create-verify-profile, the lower girdle recon, the girdle plan-kickoff, the bezel facets pauly-mode, the star facets call-saul, and the octagonal table debrief-changes.</desc>
<style>
.b0{animation:drop0 .7s cubic-bezier(.2,.9,.25,1) 0.00s backwards}
@keyframes drop0{from{transform:translateY(-6px)}}
.b1{animation:drop1 .7s cubic-bezier(.2,.9,.25,1) 0.30s backwards}
@keyframes drop1{from{transform:translateY(-15px)}}
.b2{animation:drop2 .7s cubic-bezier(.2,.9,.25,1) 0.60s backwards}
@keyframes drop2{from{transform:translateY(-24px)}}
.b3{animation:drop3 .7s cubic-bezier(.2,.9,.25,1) 0.90s backwards}
@keyframes drop3{from{transform:translateY(-33px)}}
.b4{animation:drop4 .7s cubic-bezier(.2,.9,.25,1) 1.20s backwards}
@keyframes drop4{from{transform:translateY(-42px)}}
.b5{animation:drop5 .7s cubic-bezier(.2,.9,.25,1) 1.50s backwards}
@keyframes drop5{from{transform:translateY(-51px)}}
.spark{fill:#fffbe6;opacity:.95;transform-box:fill-box;transform-origin:center;animation:twinkle 1.6s ease-in-out 2.00s 3 both}
.s2{animation-delay:2.50s}
.lab{font:600 19px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e}
.cap{font:15px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#8b949e}
.mid{font-size:16px;font-style:italic}
.lead{stroke:#8b949e;stroke-width:1.2;stroke-dasharray:3 4;fill:none}
.dot{fill:#8b949e;stroke:#fff;stroke-opacity:.6;stroke-width:1}
@keyframes twinkle{0%,100%{transform:scale(1)}50%{transform:scale(.35);opacity:.4}}
@media (prefers-reduced-motion:reduce){[class^=b],.spark{animation:none!important}}
</style>
